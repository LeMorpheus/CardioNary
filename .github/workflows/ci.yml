# Runs the test suite on every pull request and on every push to the shared
# branches. The job is called "tests": that is the name to select under
# "Require status checks to pass" in the branch protection settings.

name: CI

on:
  pull_request:
  push:
    branches: [main, develop, cardio, lung, dashboard]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v
